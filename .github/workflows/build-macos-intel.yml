name: Build Opentrack macOS Intel

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  OTR_OSX_ARCH: x86_64
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: Build macOS x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout Opentrack 2024.1.1 matatata
        uses: actions/checkout@v4
        with:
          repository: matatata/opentrack
          ref: de894ab1e0f5fb860976559d97ae007472a4c016
          submodules: true
          fetch-depth: 0

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcrun --show-sdk-version
          clang --version
          cmake --version

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v3
        with:
          archives: qtbase qtimageformats qttools qtserialport qtmultimedia
          version: 5.15.2
          target: desktop
          arch: clang_64
          dir: ${{ github.workspace }}/Qt

      - name: Show Qt environment
        run: |
          echo "Qt5_DIR=$Qt5_DIR"
          find "$Qt5_DIR" -maxdepth 2 -type d | head -50

      - name: Configure CMake
        run: |
          rm -rf build

          cmake -GNinja \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DQt5_DIR="${Qt5_DIR}" \
            -DQt5Gui_DIR="${Qt5_DIR}/lib/cmake/Qt5Gui"

      - name: Build
        run: |
          cmake --build "${{ github.workspace }}/build" \
            --config ${BUILD_TYPE} \
            --parallel 2

      - name: Install
        run: |
          cmake --install "${{ github.workspace }}/build" \
            --config ${BUILD_TYPE}

      - name: Inspect installation
        run: |
          echo "========================================"
          echo "=== Install directory ==="
          echo "========================================"

          find "${{ github.workspace }}/build/install" \
            -maxdepth 5 \
            -print

          echo
          echo "========================================"
          echo "=== Application ==="
          echo "========================================"

          find "${{ github.workspace }}/build/install/opentrack.app" \
            -maxdepth 5 \
            -print || true

          echo
          echo "========================================"
          echo "=== Custom libraries ==="
          echo "========================================"

          find "${{ github.workspace }}/build/install" \
            -type f \
            -name "*.dylib" \
            -print || true

      # ============================================================
      # Diagnose where Opentrack's own plugins were built/installed
      # ============================================================
      - name: Locate Opentrack plugins
        run: |
          set -e

          echo "========================================"
          echo "=== build/install directory ==="
          echo "========================================"

          find "${{ github.workspace }}/build/install" \
            -maxdepth 6 \
            -type f \
            -print | sort

          echo
          echo "========================================"
          echo "=== Plugin directories ==="
          echo "========================================"

          find "${{ github.workspace }}/build/install" \
            -type d \
            \( -name "Plugins" -o -name "plugins" \) \
            -print

          echo
          echo "========================================"
          echo "=== Plugin dylibs in build ==="
          echo "========================================"

          find "${{ github.workspace }}/build" \
            -type f \
            -name "*.dylib" \
            \( \
              -name "*proto*" -o \
              -name "*tracker*" -o \
              -name "*filter*" \
            \) \
            -print | sort

          echo
          echo "========================================"
          echo "=== ALL dylibs in build ==="
          echo "========================================"

          find "${{ github.workspace }}/build" \
            -type f \
            -name "*.dylib" \
            -print | sort

      - name: Fix macOS application bundle
        run: |
          set -e

          APP="${{ github.workspace }}/build/install/opentrack.app"
          INSTALL="${{ github.workspace }}/build/install"

          echo "APP=$APP"
          echo "INSTALL=$INSTALL"

          test -d "$APP"
          test -f "$APP/Contents/MacOS/opentrack"

          echo
          echo "========================================"
          echo "=== Installed Library directory ==="
          echo "========================================"

          if [ -d "$INSTALL/Library" ]; then
            find "$INSTALL/Library" \
              -maxdepth 3 \
              -type f \
              -print
          else
            echo "WARNING: $INSTALL/Library does not exist"
          fi

          echo
          echo "========================================"
          echo "=== Create Frameworks directory ==="
          echo "========================================"

          mkdir -p "$APP/Contents/Frameworks"

          echo
          echo "========================================"
          echo "=== Copy custom dylibs ==="
          echo "========================================"

          if [ -d "$INSTALL/Library" ]; then
            find "$INSTALL/Library" \
              -type f \
              -name "*.dylib" \
              -exec cp -f {} "$APP/Contents/Frameworks/" \;
          fi

          echo
          echo "Frameworks after copying:"
          find "$APP/Contents/Frameworks" \
            -maxdepth 2 \
            -print || true

          echo
          echo "========================================"
          echo "=== Fix executable RPATH ==="
          echo "========================================"

          install_name_tool \
            -add_rpath "@executable_path/../Frameworks" \
            "$APP/Contents/MacOS/opentrack" || true

          echo
          echo "Current RPATH:"
          otool -l "$APP/Contents/MacOS/opentrack" \
            | grep -A3 LC_RPATH || true

          echo
          echo "========================================"
          echo "=== Fix custom dylib reference ==="
          echo "========================================"

          if [ -f "$APP/Contents/Frameworks/opentrack-user-interface.dylib" ]; then

            echo "Found opentrack-user-interface.dylib"

            install_name_tool \
              -change \
              "$INSTALL/Library/opentrack-user-interface.dylib" \
              "@rpath/opentrack-user-interface.dylib" \
              "$APP/Contents/MacOS/opentrack" || true

          else

            echo "WARNING: opentrack-user-interface.dylib was not found"

          fi
          echo
          echo "========================================"
          echo "=== Copy Opentrack plugins ==="
          echo "========================================"

          mkdir -p "$APP/Contents/PlugIns/opentrack"

          if [ -d "$INSTALL/Plugins" ]; then

            cp -R "$INSTALL/Plugins/"* \
            "$APP/Contents/PlugIns/opentrack/"

          else

            echo "ERROR: $INSTALL/Plugins does not exist"
            exit 1

          fi

          echo
          echo "Opentrack plugins:"
          find "$APP/Contents/PlugIns/opentrack" \
            -maxdepth 2 \
            -print
          echo
          echo "========================================"
          echo "=== Run macdeployqt ==="
          echo "========================================"

          if command -v macdeployqt >/dev/null 2>&1; then

            macdeployqt "$APP" \
              -libpath="$INSTALL/Library" \
              -verbose=2

          else

            echo "ERROR: macdeployqt not found"
            exit 1

          fi

          echo
          echo "========================================"
          echo "=== Final Frameworks ==="
          echo "========================================"

          find "$APP/Contents/Frameworks" \
            -maxdepth 3 \
            -print || true

          echo
          echo "========================================"
          echo "=== Final PlugIns ==="
          echo "========================================"

          find "$APP/Contents/PlugIns" \
            -maxdepth 4 \
            -print || true

      - name: Verify application
        run: |
          set -e

          APP="${{ github.workspace }}/build/install/opentrack.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: opentrack.app was not found"
            exit 1
          fi

          echo "========================================"
          echo "=== Application ==="
          echo "========================================"

          echo "$APP"

          echo
          echo "========================================"
          echo "=== Executable architecture ==="
          echo "========================================"

          file "$APP/Contents/MacOS/opentrack"

          echo
          echo "========================================"
          echo "=== Deployment information ==="
          echo "========================================"

          otool -l "$APP/Contents/MacOS/opentrack" \
            | grep -A4 LC_BUILD_VERSION || true

          echo
          echo "========================================"
          echo "=== RPATH ==="
          echo "========================================"

          otool -l "$APP/Contents/MacOS/opentrack" \
            | grep -A3 LC_RPATH || true

          echo
          echo "========================================"
          echo "=== Linked libraries ==="
          echo "========================================"

          otool -L "$APP/Contents/MacOS/opentrack"

          echo
          echo "========================================"
          echo "=== Frameworks ==="
          echo "========================================"

          find "$APP/Contents/Frameworks" \
            -maxdepth 2 \
            -print || true

          echo
          echo "========================================"
          echo "=== PlugIns ==="
          echo "========================================"

          find "$APP/Contents/PlugIns" \
            -maxdepth 4 \
            -print || true

          echo
          echo "========================================"
          echo "=== Check custom dylib ==="
          echo "========================================"

          if [ -f "$APP/Contents/Frameworks/opentrack-user-interface.dylib" ]; then

            echo "SUCCESS: opentrack-user-interface.dylib exists"

            file \
              "$APP/Contents/Frameworks/opentrack-user-interface.dylib"

            echo
            echo "Dylib dependencies:"

            otool -L \
              "$APP/Contents/Frameworks/opentrack-user-interface.dylib"

          else

            echo "ERROR: opentrack-user-interface.dylib is missing"
            exit 1

          fi

      - name: Package
        run: |
          set -e

          mkdir -p artifacts

          APP="${{ github.workspace }}/build/install/opentrack.app"

          test -d "$APP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "artifacts/opentrack-macos13-intel.zip"

          echo
          echo "========================================"
          echo "=== Artifact ==="
          echo "========================================"

          ls -lh artifacts/opentrack-macos13-intel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-macos13-intel
          path: artifacts/opentrack-macos13-intel.zip
          if-no-files-found: error
