name: Build Opentrack macOS Intel

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  OTR_OSX_ARCH: x86_64
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: Build macOS x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout Opentrack 2024.1.1 matatata
        uses: actions/checkout@v4
        with:
          repository: matatata/opentrack
          ref: de894ab1e0f5fb860976559d97ae007472a4c016
          submodules: true
          fetch-depth: 0

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcrun --show-sdk-version
          clang --version
          cmake --version

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v3
        with:
          archives: qtbase qtimageformats qttools qtserialport qtmultimedia
          version: 5.15.2
          target: desktop
          arch: clang_64
          dir: ${{ github.workspace }}/Qt

      - name: Show Qt environment
        run: |
          echo "Qt5_DIR=$Qt5_DIR"
          find "$Qt5_DIR" -maxdepth 2 -type d | head -50

      - name: Configure CMake
        run: |
          rm -rf build

          cmake -GNinja \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DQt5_DIR="${Qt5_DIR}" \
            -DQt5Gui_DIR="${Qt5_DIR}/lib/cmake/Qt5Gui"

      - name: Build
        run: |
          cmake --build "${{ github.workspace }}/build" \
            --config ${BUILD_TYPE} \
            --target install \
            --parallel 2

      - name: Find application
        run: |
          echo "Installed files:"
          find build -maxdepth 6 -print

      - name: Verify application
        run: |
          APP=$(find build -name "opentrack.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: opentrack.app was not found"
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          echo "Executable architecture:"
          file "$APP/Contents/MacOS/opentrack"

          echo "Deployment information:"
          otool -l "$APP/Contents/MacOS/opentrack" | \
            grep -A4 LC_BUILD_VERSION || true

          echo "Linked libraries:"
          otool -L "$APP/Contents/MacOS/opentrack"

      - name: Package
        run: |
          mkdir -p artifacts

          APP=$(find build -name "opentrack.app" -type d | head -n 1)

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "artifacts/opentrack-macos13-intel.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-macos13-intel
          path: artifacts/opentrack-macos13-intel.zip
          if-no-files-found: error
